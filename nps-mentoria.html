<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Evaluación de la Mentoría — UNEQ Mentoring</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<style>
  /* Estilos propios de esta página pública — no dependen de styles.css */
  :root {
    --nm-negro: #000000;
    --nm-blanco: #FFFFFF;
    --nm-texto: #5A5F6B;
    --nm-texto-suave: #6E7380;
    --nm-azul: #2B3A8C;
    --nm-azul-hover: #22306F;
    --nm-gris-campo: #EFEFEF;
    --nm-borde-campo: #D5D7DB;
    --nm-radio: 18px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--nm-negro);
    font-family: 'Montserrat', system-ui, sans-serif;
    color: var(--nm-texto);
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  /* ---------- Fondo espacial ---------- */
  .nm-espacio {
    position: relative;
    overflow: hidden;
    background:
      radial-gradient(circle at 60% 38%, rgba(70,150,255,.55) 0, rgba(40,90,200,.25) 12%, rgba(0,0,0,0) 32%),
      linear-gradient(118deg, rgba(0,0,0,0) 62%, rgba(70,70,70,.9) 63%, rgba(20,20,20,.95) 100%),
      radial-gradient(ellipse at 30% 20%, #0c1428 0%, #04070f 55%, #000 100%);
  }
  .nm-espacio::before { /* estrellas */
    content: "";
    position: absolute; inset: 0;
    background-image:
      radial-gradient(1px 1px at 12% 18%, rgba(255,255,255,.8), transparent),
      radial-gradient(1px 1px at 28% 62%, rgba(255,255,255,.6), transparent),
      radial-gradient(1.5px 1.5px at 44% 12%, rgba(255,255,255,.9), transparent),
      radial-gradient(1px 1px at 8% 80%, rgba(255,255,255,.5), transparent),
      radial-gradient(1px 1px at 70% 72%, rgba(255,255,255,.6), transparent),
      radial-gradient(1px 1px at 52% 88%, rgba(255,255,255,.4), transparent),
      radial-gradient(1.5px 1.5px at 20% 40%, rgba(255,255,255,.7), transparent),
      radial-gradient(1px 1px at 36% 30%, rgba(255,255,255,.5), transparent),
      radial-gradient(1px 1px at 58% 52%, rgba(255,255,255,.5), transparent),
      radial-gradient(1px 1px at 16% 94%, rgba(255,255,255,.6), transparent);
    pointer-events: none;
  }
  .nm-espacio::after { /* destello */
    content: "";
    position: absolute;
    width: 90px; height: 90px;
    left: calc(50% + 70px); top: 70px;
    background: radial-gradient(circle, #fff 0, rgba(180,220,255,.9) 6%, rgba(90,160,255,.35) 22%, rgba(0,0,0,0) 60%);
    pointer-events: none;
  }

  /* ---------- Marca ---------- */
  .nm-marca {
    position: relative; z-index: 1;
    display: flex; flex-direction: column; align-items: center;
    text-align: center;
  }
  .nm-marca__halo {
    position: relative;
    width: 250px; height: 250px;
    display: flex; align-items: center; justify-content: center;
  }
  .nm-marca__halo::before { /* anillo azul */
    content: "";
    position: absolute; inset: 20px;
    border-radius: 50%;
    box-shadow: 0 0 0 1px rgba(110,170,255,.25), 0 0 60px 8px rgba(60,130,255,.35) inset, 0 0 40px rgba(60,130,255,.25);
  }
  .nm-marca__halo::after { /* haz de luz horizontal */
    content: "";
    position: absolute; left: -60px; right: -30px; top: 42%; height: 3px;
    background: linear-gradient(90deg, rgba(0,0,0,0), rgba(255,210,150,.7) 35%, rgba(255,255,255,.9) 55%, rgba(0,0,0,0));
    filter: blur(1.5px);
  }
  .nm-marca__logo {
    position: relative; z-index: 1;
    width: 210px; height: 210px; object-fit: contain;
    filter: drop-shadow(0 8px 24px rgba(0,0,0,.6));
  }
  .nm-marca__titulo {
    margin: 8px 0 0;
    color: var(--nm-blanco);
    font-weight: 700;
    font-size: 34px;
    letter-spacing: .5px;
  }

  /* ---------- Tarjetas ---------- */
  .nm-tarjeta {
    background: var(--nm-blanco);
    border-radius: var(--nm-radio);
    padding: 26px 24px;
  }
  .nm-intro { text-align: center; }
  .nm-intro__titulo {
    margin: 0 0 18px;
    font-size: 17px; font-weight: 600; letter-spacing: .6px;
    text-transform: uppercase;
  }
  .nm-intro__texto { margin: 0; font-size: 17px; line-height: 1.3; }
  .nm-intro__texto strong { font-weight: 700; }

  .nm-mentor {
    display: flex; align-items: center; gap: 24px;
    padding: 22px 28px;
  }
  .nm-mentor__foto {
    flex: 0 0 auto;
    width: 96px; height: 96px; border-radius: 50%;
    object-fit: cover;
    background: #0b1020;
    border: 2px solid #0b1020;
  }
  .nm-mentor__foto--logo { object-fit: contain; padding: 14px; }
  .nm-mentor__nombre { margin: 0 0 4px; font-size: 22px; font-weight: 700; color: var(--nm-texto); }
  .nm-mentor__tema { margin: 0; font-size: 16px; line-height: 1.3; color: var(--nm-texto-suave); }

  .nm-pregunta { padding: 30px 28px 40px; }
  .nm-pregunta__texto {
    margin: 0 auto 22px; max-width: 460px;
    text-align: center; font-size: 19px; font-weight: 700; line-height: 1.25;
  }

  /* ---------- Slider ---------- */
  .nm-slider { position: relative; padding: 76px 0 0; margin: 0 22px; }
  .nm-slider__burbuja {
    position: absolute; top: 0;
    width: 52px; height: 52px; border-radius: 50%;
    background: var(--nm-azul); color: var(--nm-blanco);
    display: flex; align-items: center; justify-content: center;
    font-size: 21px; font-weight: 600;
    transform: translateX(-50%);
    pointer-events: none;
    transition: left .08s ease-out;
  }
  .nm-slider input[type=range] {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 26px; margin: 0;
    background: transparent; cursor: pointer;
  }
  .nm-slider input[type=range]:focus { outline: none; }
  .nm-slider input[type=range]::-webkit-slider-runnable-track {
    height: 8px; border-radius: 0;
    background: linear-gradient(90deg, #1E90FF 0%, #3A75B8 28%, #5B5E66 52%, #9C8656 76%, #E9C46A 100%);
  }
  .nm-slider input[type=range]::-moz-range-track {
    height: 8px;
    background: linear-gradient(90deg, #1E90FF 0%, #3A75B8 28%, #5B5E66 52%, #9C8656 76%, #E9C46A 100%);
  }
  .nm-slider input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 26px; height: 26px; margin-top: -9px;
    border-radius: 50%; background: #05070C; border: 0;
    box-shadow: 0 1px 3px rgba(0,0,0,.35);
  }
  .nm-slider input[type=range]::-moz-range-thumb {
    width: 26px; height: 26px; border-radius: 50%; background: #05070C; border: 0;
  }
  .nm-slider input[type=range]:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 4px rgba(43,58,140,.3); }
  .nm-slider__etiquetas {
    display: flex; justify-content: space-between;
    margin-top: 10px;
    font-size: 16px; font-style: italic; line-height: 1.15; color: var(--nm-texto);
  }
  .nm-slider__etiquetas span:last-child { text-align: right; }

  /* ---------- Comentario y botón ---------- */
  .nm-campo { margin: 44px 0 0; }
  .nm-campo label { display: block; margin: 0 0 12px 14px; font-size: 17px; }
  .nm-campo label { line-height: 1.3; }
  .nm-opcional { color: #8A8F99; font-size: 14px; }
  .nm-destacado { color: var(--nm-azul); }
  .nm-campo textarea {
    width: 100%; min-height: 150px; resize: vertical;
    padding: 14px 12px;
    background: var(--nm-gris-campo);
    border: 1px solid var(--nm-borde-campo); border-radius: 4px;
    font-family: inherit; font-size: 16px; color: #333;
  }
  .nm-campo textarea::placeholder { color: #7A7F88; }
  .nm-campo textarea:focus { outline: 2px solid rgba(43,58,140,.35); border-color: var(--nm-azul); }
  .nm-boton {
    display: block; margin: 24px auto 0;
    width: 100%; max-width: 408px;
    padding: 11px 20px;
    background: var(--nm-azul); color: var(--nm-blanco);
    border: 0; border-radius: 6px;
    font-family: inherit; font-size: 19px; font-weight: 500;
    cursor: pointer; transition: background .15s;
  }
  .nm-boton:hover { background: var(--nm-azul-hover); }
  .nm-boton:disabled { opacity: .7; cursor: default; }

  .nm-mensaje { text-align: center; padding: 48px 28px; }
  .nm-mensaje h3 { margin: 0 0 10px; font-size: 22px; font-weight: 700; }
  .nm-mensaje p { margin: 0; font-size: 16px; }

  /* ---------- Diagramación MÓVIL (por defecto) ---------- */
  .nm-layout { max-width: 560px; margin: 0 auto; }
  .nm-cabecera { padding: 36px 20px 50px; }
  .nm-cabecera { -webkit-mask-image: linear-gradient(#000 88%, transparent); mask-image: linear-gradient(#000 88%, transparent); }
  .nm-columna-izq__tarjetas, .nm-columna-der { padding: 0 20px; }
  .nm-columna-izq__tarjetas { display: flex; flex-direction: column; gap: 22px; margin-top: -24px; position: relative; z-index: 2; }
  .nm-columna-der { margin-top: 22px; padding-bottom: 40px; }

  @media (max-width: 959px) {
    .nm-columna-izq.nm-espacio { background: none; overflow: visible; }
    .nm-columna-izq.nm-espacio::before, .nm-columna-izq.nm-espacio::after { display: none; }
  }

  @media (max-width: 420px) {
    .nm-marca__halo { width: 200px; height: 200px; }
    .nm-marca__logo { width: 170px; height: 170px; }
    .nm-marca__titulo { font-size: 28px; }
    .nm-mentor { gap: 16px; padding: 18px 20px; }
    .nm-mentor__foto { width: 80px; height: 80px; }
    .nm-pregunta { padding: 26px 18px 32px; }
    .nm-slider { margin: 0 8px; }
  }

  /* ---------- Diagramación PC ---------- */
  @media (min-width: 960px) {
    .nm-layout {
      max-width: none;
      display: grid;
      grid-template-columns: minmax(420px, 44%) 1fr;
      min-height: 100vh;
    }
    .nm-columna-izq {
      position: sticky; top: 0;
      height: 100vh;
      display: flex; flex-direction: column; justify-content: center;
      padding: 40px 48px;
    }
    .nm-cabecera { padding: 0 0 36px; background: none; -webkit-mask-image: none; mask-image: none; overflow: visible; }
    .nm-cabecera::before, .nm-cabecera::after { display: none; }
    .nm-columna-izq__tarjetas { padding: 0; margin: 0; max-width: 520px; width: 100%; align-self: center; }
    .nm-columna-der {
      display: flex; align-items: center; justify-content: center;
      margin: 0; padding: 48px 56px;
      background: linear-gradient(180deg, #0a0c12 0%, #000 100%);
    }
    .nm-columna-der > div { width: 100%; max-width: 640px; }
    .nm-pregunta { padding: 44px 48px 48px; }
    .nm-pregunta__texto { font-size: 22px; max-width: 520px; }
    .nm-slider { margin: 0 36px; }
    .nm-campo textarea { min-height: 170px; }
    .nm-espacio::after { left: auto; right: 22%; top: 16%; }
  }
</style>
</head>
<body>

<div class="nm-layout">
  <!-- Columna izquierda: marca + intro + mentor -->
  <aside class="nm-columna-izq nm-espacio">
    <header class="nm-cabecera nm-espacio">
      <div class="nm-marca">
        <div class="nm-marca__halo">
          <img class="nm-marca__logo" src="assets/logos/isotipo-uneq.png" alt="UNEQ">
        </div>
        <h1 class="nm-marca__titulo">UNEQ MENTORING</h1>
      </div>
    </header>

    <div class="nm-columna-izq__tarjetas">
      <section class="nm-tarjeta nm-intro">
        <h2 class="nm-intro__titulo">Evaluación anónima de la mentoría</h2>
        <p class="nm-intro__texto">
          Esta evaluación es <strong>100% anónima.</strong><br>
          Cuéntanos qué te pareció la mentoría de esta sesión
        </p>
      </section>

      <section class="nm-tarjeta nm-mentor" id="nps-mentoria-mentor">
        <img class="nm-mentor__foto nm-mentor__foto--logo" id="nps-mentoria-mentor-foto" src="assets/logos/isotipo-uneq.png" alt="">
        <div>
          <p class="nm-mentor__nombre" id="nps-mentoria-mentor-nombre">Mentoría</p>
          <p class="nm-mentor__tema" id="nps-mentoria-tema">esta sesión</p>
        </div>
      </section>
    </div>
  </aside>

  <!-- Columna derecha: pregunta -->
  <main class="nm-columna-der">
    <div id="nps-mentoria-root"></div>
  </main>
</div>

<script type="module" src="js/nps-mentoria-form.js"></script>
</body>
</html>
