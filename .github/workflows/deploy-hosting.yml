# Publica la web en Firebase Hosting (app.somosuneq.com y alumnos.somosuneq.com)
# cada vez que se mergea a main. También se puede lanzar a mano desde la pestaña
# Actions > "Deploy a Firebase Hosting" > Run workflow.
#
# Necesita UN secreto en el repositorio: FIREBASE_SERVICE_ACCOUNT (el JSON de la
# cuenta de servicio). Si falta, este flujo avisa y se salta el despliegue sin dar error.
# Solo se despliega el sitio "uneq-app" (lo define firebase.json); el sitio de hitos no se toca.
#
# Las funciones y las reglas de Firebase NO se publican aquí: siguen siendo manuales.

name: Deploy a Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Un despliegue a la vez; si se mergean dos cambios seguidos, el segundo espera al primero.
concurrency:
  group: hosting-uneq-app
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HAY_CLAVE: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - name: Aviso si falta la clave de Firebase
        if: env.HAY_CLAVE != 'true'
        run: echo "::warning::Falta el secreto FIREBASE_SERVICE_ACCOUNT. No se desplegó a Hosting. Agrégalo en Settings > Secrets and variables > Actions."

      - name: Descargar el código
        if: env.HAY_CLAVE == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Desplegar a Firebase Hosting
        if: env.HAY_CLAVE == 'true'
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0.11.0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: onboarding-uneq

      - name: Comprobar que la versión publicada es la nueva
        if: env.HAY_CLAVE == 'true'
        run: |
          esperada=$(tr -d ' \r\n' < version.json)
          for intento in 1 2 3 4 5 6; do
            publicada=$(curl -fsS "https://uneq-app.web.app/version.json?x=$RANDOM" | tr -d ' \r\n' || true)
            if [ "$publicada" = "$esperada" ]; then
              echo "Publicado: $publicada"
              exit 0
            fi
            echo "Intento $intento: se publicó '$publicada' y se esperaba '$esperada'. Reintentando…"
            sleep 10
          done
          echo "::error::La versión publicada no coincide con version.json."
          exit 1
