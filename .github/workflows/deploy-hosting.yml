# Publica la web en Firebase Hosting (app.somosuneq.com y alumnos.somosuneq.com)
# cada vez que se mergea a main. También se puede lanzar a mano desde la pestaña
# Actions > "Deploy a Firebase Hosting" > Run workflow.
#
# SIN CLAVES: GitHub se identifica ante Google con "federación de identidades"
# (Workload Identity Federation). No hay ningún secreto guardado en el repositorio.
# Solo el repo uneqacademy/onboarding-uneq, desde la rama main, puede actuar como la
# cuenta de servicio github-hosting-deploy (eso se define en Google Cloud).
#
# Solo se despliega el sitio "uneq-app" (lo define firebase.json); el sitio de hitos no se toca.
# Las funciones y las reglas de Firebase NO se publican aquí: siguen siendo manuales.

name: Deploy a Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # necesario para que GitHub pueda identificarse ante Google

# Un despliegue a la vez; si se mergean dos cambios seguidos, el segundo espera al primero.
concurrency:
  group: hosting-uneq-app
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Entrar a Google Cloud (sin claves)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/165589582297/locations/global/workloadIdentityPools/github/providers/uneq-repos
          service_account: github-hosting-deploy@onboarding-uneq.iam.gserviceaccount.com

      - name: Preparar Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Desplegar a Firebase Hosting
        run: npx --yes firebase-tools@15.34.0 deploy --only hosting --project onboarding-uneq --non-interactive

      - name: Comprobar que la versión publicada es la nueva
        run: |
          esperada=$(tr -d ' \r\n' < version.json)
          for intento in 1 2 3 4 5 6; do
            publicada=$(curl -fsS "https://uneq-app.web.app/version.json?x=$RANDOM" | tr -d ' \r\n' || true)
            if [ "$publicada" = "$esperada" ]; then
              echo "Publicado: $publicada"
              exit 0
            fi
            echo "Intento $intento: se publicó '$publicada' y se esperaba '$esperada'. Reintentando…"
            sleep 10
          done
          echo "::error::La versión publicada no coincide con version.json."
          exit 1
